name: CI
on:
  push:
    branches-ignore: [master]
    tags-ignore: ['**']
  pull_request:
    branches-ignore: [master]
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Owner 2026-10-31: macOS and Windows are off until pull request #3 works completely on Linux, to keep the CI
        # loop and its cost small. They come back afterwards (backlog-cli item 085), and their failures are fixed then.
        # Windows: shared backlog mode does not support it yet (owner 2026-10-24; backlog-cli item 024).
        os: [ubuntu-latest] # macos-latest, windows-latest
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npm pack --dry-run
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # item 058: the skill's checks are tests (no Python validator ships with the skill any more)
      - run: node --test .agents/test/integrations.test.js
