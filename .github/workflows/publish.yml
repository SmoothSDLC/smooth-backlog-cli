name: Publish and verify GitHub package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: publish-main
  queue: single
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  merged-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require a merged pull request with successful CI
        run: node .agents/scripts/verify-release-pr.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  validate:
    needs: merged-pr
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: github-packages
    outputs:
      version: ${{ steps.package.outputs.version }}
      integrity: ${{ steps.package.outputs.integrity }}
      release: ${{ steps.plan.outputs.release }}
      upgrade_from: ${{ steps.prepare.outputs.upgrade_from }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@smoothsdlc'
      - run: npm ci --ignore-scripts
      - name: Read the immutable release tag
        id: prepare
        run: node .agents/scripts/release.mjs prepare
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pack the release artifact
        if: steps.prepare.outputs.release == 'true'
        id: package
        run: |
          npm pack --json > "$RUNNER_TEMP/backlog-package.json"
          node <<'JS'
          const fs = require('node:fs');
          const [pkg] = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/backlog-package.json', 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkg.version}\nfilename=${pkg.filename}\nintegrity=${pkg.integrity}\n`);
          JS
      - name: Plan an immutable package release
        if: steps.prepare.outputs.release == 'true'
        id: plan
        run: node .agents/scripts/release.mjs plan
        env:
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_INTEGRITY: ${{ steps.package.outputs.integrity }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested tarball
        if: steps.plan.outputs.publish == 'true'
        run: npm publish "$PACKAGE_FILE" --ignore-scripts --registry=https://npm.pkg.github.com
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.filename }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  verify-published-package:
    needs: publish
    if: needs.publish.outputs.release == 'true'
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://npm.pkg.github.com
          scope: '@smoothsdlc'
      - name: Install from GitHub Packages and exercise the installed CLI
        run: node .agents/scripts/verify-published-package.mjs
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_INTEGRITY: ${{ needs.publish.outputs.integrity }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKLOG_UPGRADE_FROM: ${{ needs.publish.outputs.upgrade_from }}
          BACKLOG_RELEASE_RESULT: ${{ runner.temp }}/backlog-published-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: published-package-${{ matrix.os }}-node${{ matrix.node }}
          path: ${{ runner.temp }}/backlog-published-result.json
